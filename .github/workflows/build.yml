
name: Build Zakkerni APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
        
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
    

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/zakkerni/app
          cp index.html app/src/main/assets/index.html
          mkdir -p app/src/main/assets/audio
          cp audio/salawat.mp3 app/src/main/assets/audio/salawat.mp3
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Zakkerni"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.zakkerni.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.zakkerni.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="ذَكِّرْنِي" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".ReminderReceiver" android:exported="false" />
                  <service android:name=".SalawatService" android:exported="false" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/zakkerni/app/MainActivity.java <<'EOF'
          package com.zakkerni.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.addJavascriptInterface(new ReminderBridge(), "AndroidReminder");
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
              private class ReminderBridge {
                  @JavascriptInterface public void startSalawatReminder(int minutes) {
                      ReminderScheduler.start(MainActivity.this, minutes);
                  }
                  @JavascriptInterface public void stopSalawatReminder() {
                      ReminderScheduler.stop(MainActivity.this);
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/zakkerni/app/ReminderScheduler.java <<'EOF'
          package com.zakkerni.app;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          public final class ReminderScheduler {
              private static final String PREFS = "zakkerni_salawat";
              private static final int REQUEST_CODE = 517;
              private ReminderScheduler() {}
              public static void start(Context context, int minutes) {
                  int safeMinutes = Math.max(1, Math.min(minutes, 1440));
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putInt("interval", safeMinutes).putBoolean("enabled", true).apply();
                  scheduleNext(context);
              }
              public static void stop(Context context) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putBoolean("enabled", false).apply();
                  PendingIntent pending = pendingIntent(context);
                  AlarmManager alarms = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (alarms != null) alarms.cancel(pending);
                  pending.cancel();
                  context.stopService(new Intent(context, SalawatService.class));
              }
              public static boolean isEnabled(Context context) {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean("enabled", false);
              }
              public static void scheduleNext(Context context) {
                  SharedPreferences prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  if (!prefs.getBoolean("enabled", false)) return;
                  int minutes = Math.max(1, prefs.getInt("interval", 60));
                  long at = System.currentTimeMillis() + minutes * 60_000L;
                  AlarmManager alarms = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (alarms == null) return;
                  PendingIntent pending = pendingIntent(context);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) alarms.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pending);
                  else alarms.setExact(AlarmManager.RTC_WAKEUP, at, pending);
              }
              private static PendingIntent pendingIntent(Context context) {
                  Intent intent = new Intent(context, ReminderReceiver.class);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) flags |= PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getBroadcast(context, REQUEST_CODE, intent, flags);
              }
          }
          EOF
          cat > app/src/main/java/com/zakkerni/app/ReminderReceiver.java <<'EOF'
          package com.zakkerni.app;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          public class ReminderReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context context, Intent intent) {
                  if (!ReminderScheduler.isEnabled(context)) return;
                  Intent service = new Intent(context, SalawatService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(service);
                  else context.startService(service);
                  ReminderScheduler.scheduleNext(context);
              }
          }
          EOF
          cat > app/src/main/java/com/zakkerni/app/SalawatService.java <<'EOF'
          package com.zakkerni.app;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.res.AssetFileDescriptor;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.os.Build;
          import android.os.IBinder;
          public class SalawatService extends Service {
              private static final String CHANNEL = "zakkerni_salawat_audio";
              private MediaPlayer player;
              @Override public void onCreate() {
                  super.onCreate();
                  createChannel();
                  Notification notification = new Notification.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("ذَكِّرْنِي")
                      .setContentText("تذكير بالصلاة على النبي ﷺ")
                      .setOngoing(true).build();
                  startForeground(517, notification);
              }
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (player != null) { player.release(); player = null; }
                  try (AssetFileDescriptor audio = getAssets().openFd("audio/salawat.mp3")) {
                      player = new MediaPlayer();
                      player.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                      player.setDataSource(audio.getFileDescriptor(), audio.getStartOffset(), audio.getLength());
                      player.setOnCompletionListener(mp -> stopSelf());
                      player.setOnErrorListener((mp, what, extra) -> { stopSelf(); return true; });
                      player.prepare();
                      player.start();
                  } catch (Exception error) { stopSelf(); }
                  return START_NOT_STICKY;
              }
              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL, "تذكير الصلاة على النبي", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }
              @Override public void onDestroy() {
                  if (player != null) { player.release(); player = null; }
                  stopForeground(true);
                  super.onDestroy();
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zakkerni-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
